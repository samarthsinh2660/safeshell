name: release
# A release happens when a pull request from a branch named release/vX.Y.Z is merged into main.
# It tags main, builds the tarballs and the .debs (amd64 and arm64), and creates the GitHub Release.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Version from the branch name
        id: v
        run: |
          v=${HEAD_REF#release/}
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "branch must be release/vX.Y.Z, got $HEAD_REF"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "deb=${v#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build everything
        run: |
          make check
          make dist VERSION=${{ steps.v.outputs.version }}
          make deb VERSION=${{ steps.v.outputs.version }}
          cd dist && sha256sum *.tar.gz *.deb > SHA256SUMS
      - name: GitHub Release
        run: |
          gh release create "${{ steps.v.outputs.version }}" dist/*.tar.gz dist/*.deb dist/SHA256SUMS \
            --target "$MERGE_SHA" --title "SafeShell ${{ steps.v.outputs.version }}" --generate-notes
