name: ci
on:
  push:
    branches: [main]
  pull_request:

# Each job is its own check on the pull request, so a failure shows exactly which part broke.
# Branch protection requires only "check", which passes when every other job passed.
jobs:
  format-and-vet:
    name: Format and vet (amd64, arm64, riscv64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
      - name: go vet (amd64)
        run: go vet ./...
      - name: go vet (arm64)
        run: GOOS=linux GOARCH=arm64 go vet ./...
      - name: go vet (riscv64)
        run: GOOS=linux GOARCH=riscv64 go vet ./...

  unit-tests:
    name: Unit tests (race detector) and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  install-script:
    name: Installer script test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash test/scripts/install_test.sh

  fuzz:
    name: Fuzz parser and classifier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=15s

  integration:
    name: Integration tests and sweep (real binary, real sandbox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install zsh, so the zsh hook tests run too
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - run: make build
      # Ubuntu 24.04 lets a binary use user namespaces only with an AppArmor profile;
      # install the same profile the .deb ships, for the binary just built.
      - name: Allow the sandbox
        run: scripts/install-apparmor.sh --yes bin/safeshell && bin/safeshell doctor
      # SS_NEED_SANDBOX makes a sandbox test fail instead of skip, so none is skipped silently.
      - name: Integration tests with the real sandbox
        run: SS_NEED_SANDBOX=1 make integration
      - name: Sweep every labelled command through the real binary
        run: SS_NEED_SANDBOX=1 SS_SWEEP=1 go test -count=1 -timeout 20m ./test/integration -run Sweep

  packages:
    name: Build tarballs and .debs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist deb VERSION=v0.0.0-ci
      - name: Check what the .deb files contain
        run: bash test/scripts/deb_test.sh dist/*.deb
      - name: Lint the .deb files (errors fail)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lintian
          lintian --fail-on error dist/*.deb

  debian:
    name: Debian package from debian/ (sid, lintian)
    runs-on: ubuntu-24.04
    container: debian:sid
    steps:
      - uses: actions/checkout@v4
      # Build exactly as Debian would: build-deps from Debian's own archive, no network for Go.
      - name: Install the build dependencies from debian/control
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends build-essential dpkg-dev lintian
          apt-get build-dep -y -q --no-install-recommends ./
      - name: dpkg-buildpackage
        run: dpkg-buildpackage -b -us -uc
      - name: lintian (errors fail)
        run: lintian --fail-on error ../safeshell_*.deb

  check:
    name: check
    if: always()
    needs: [format-and-vet, unit-tests, install-script, fuzz, integration, packages, debian]
    runs-on: ubuntu-24.04
    steps:
      - name: A job failed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Every job passed
        run: echo "all jobs passed"
