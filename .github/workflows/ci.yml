name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each job is its own check on the pull request, so a failure shows exactly which part broke.
# Branch protection requires only "check", which passes when every other job passed.
jobs:
  format-and-vet:
    name: Format and vet (amd64, arm64, riscv64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
      - name: go vet (amd64)
        run: go vet ./...
      - name: go vet (arm64)
        run: GOOS=linux GOARCH=arm64 go vet ./...
      - name: go vet (riscv64)
        run: GOOS=linux GOARCH=riscv64 go vet ./...

  unit-tests:
    name: Unit tests (race detector) and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Classifier latency (p95 shown in the log)
        run: go test -count=1 -v -run P95 ./eval
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  install-script:
    name: Installer script test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash test/scripts/install_test.sh
      - run: bash test/scripts/apparmor_test.sh

  fuzz:
    name: Fuzz parser and classifier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=15s

  integration:
    name: Integration tests and sweep (real binary, real sandbox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install zsh and fish, so the zsh and fish hook tests run too
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish
      - run: make build
      # Ubuntu 24.04 lets a binary use user namespaces only with an AppArmor profile;
      # install the same profile the .deb ships, for the binary just built.
      - name: Allow the sandbox
        run: scripts/install-apparmor.sh --yes bin/safeshell && bin/safeshell doctor
      # SS_NEED_SANDBOX makes a sandbox test fail instead of skip, so none is skipped silently.
      - name: Integration tests with the real sandbox
        run: SS_NEED_SANDBOX=1 make integration
      - name: Sweep every labelled command through the real binary
        run: SS_NEED_SANDBOX=1 SS_SWEEP=1 go test -count=1 -timeout 20m ./test/integration -run Sweep

  native-snapshots:
    name: Native snapshots on real btrfs and ZFS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install the btrfs and ZFS tools
        run: sudo apt-get update -q && sudo apt-get install -y -q btrfs-progs zfsutils-linux
      # Like Fedora and openSUSE: the subvolume is its own mount ("subvol=home"), not a folder
      # inside a bigger btrfs mount.
      - name: A btrfs subvolume the runner user owns, mounted on its own
        run: |
          truncate -s 1G "$RUNNER_TEMP/btrfs.img"
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          sudo mkdir -p /mnt/btrfs-top /mnt/btrfs
          sudo mount -o loop "$RUNNER_TEMP/btrfs.img" /mnt/btrfs-top
          sudo btrfs subvolume create /mnt/btrfs-top/home
          sudo umount /mnt/btrfs-top
          sudo mount -o loop,subvol=home,user_subvol_rm_allowed "$RUNNER_TEMP/btrfs.img" /mnt/btrfs
          sudo chown "$USER" /mnt/btrfs
          echo "SS_BTRFS_DIR=/mnt/btrfs" >> "$GITHUB_ENV"
      # The runner kernel may have no ZFS module. Then only the ZFS part is skipped, and says so.
      - name: A ZFS dataset the runner user may snapshot
        run: |
          if ! sudo modprobe zfs; then
            echo "::warning::ZFS module not available on this runner, so the ZFS part of this job is skipped"
            exit 0
          fi
          truncate -s 1G "$RUNNER_TEMP/zfs.img"
          sudo zpool create -m /mnt/zfspool sspool "$RUNNER_TEMP/zfs.img"
          sudo zfs create sspool/home
          sudo zfs allow "$USER" snapshot,destroy,mount,diff sspool/home
          sudo chown -R "$USER" /mnt/zfspool/home
          echo "SS_ZFS_DIR=/mnt/zfspool/home" >> "$GITHUB_ENV"
      - run: make build
      - name: Allow the sandbox
        run: scripts/install-apparmor.sh --yes bin/safeshell && bin/safeshell doctor
      # Facts for reading a failure; none of these can fail the job.
      - name: Diagnostics
        run: |
          findmnt /mnt/btrfs || true
          stat -f -c %T /mnt/btrfs || true
          stat -c %i /mnt/btrfs || true
          btrfs subvolume show /mnt/btrfs || true
          echo "--- snapshot as the runner user, no sudo"
          btrfs subvolume snapshot -r /mnt/btrfs /mnt/btrfs/.probe && btrfs property set -ts /mnt/btrfs/.probe ro false && btrfs subvolume delete /mnt/btrfs/.probe || true
          echo "--- doctor with HOME on btrfs"
          mkdir -p /mnt/btrfs/diag-data
          HOME=/mnt/btrfs XDG_DATA_HOME=/mnt/btrfs/diag-data bin/safeshell doctor | grep -i snapshot || true
          echo "--- simulate rm -rf on btrfs"
          mkdir -p /mnt/btrfs/diag/proj && echo x > /mnt/btrfs/diag/proj/a.txt
          bin/safeshell simulate --json --cwd /mnt/btrfs/diag "rm -rf proj" || true
      # With SS_BTRFS_DIR or SS_ZFS_DIR set, the test fails unless the native snapshot was really used.
      - name: Undo from a native snapshot
        run: SS_NEED_SANDBOX=1 go test -count=1 -v -run TestUndoFromNativeSnapshot ./test/integration

  script-check-action:
    name: SafeShell check action (passes a good script, fails a bad one)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Good script
        id: good
        uses: ./.github/actions/safeshell-check
        with:
          paths: test/fixtures/check-action/good.sh
      - name: Bad script (must fail)
        id: bad
        continue-on-error: true
        uses: ./.github/actions/safeshell-check
        with:
          paths: test/fixtures/check-action/bad.sh
      - name: The good script passed and the bad one failed
        env:
          GOOD: ${{ steps.good.outcome }}
          BAD: ${{ steps.bad.outcome }}
        run: test "$GOOD" = success && test "$BAD" = failure

  packages:
    name: Build tarballs and .debs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make dist deb VERSION=v0.0.0-ci
      - name: Check what the .deb files contain
        run: bash test/scripts/deb_test.sh dist/*.deb
      - name: Lint the .deb files (errors fail)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lintian
          lintian --fail-on error dist/*.deb

  reproducible:
    name: Release tarballs are reproducible (two clean builds, same bytes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Same command the release workflow runs (make dist), from two separate clean copies of the commit.
      - name: Build the tarballs twice from two clean copies
        run: |
          for n in 1 2; do
            mkdir -p "$RUNNER_TEMP/build$n"
            git archive HEAD | tar -x -C "$RUNNER_TEMP/build$n"
            (cd "$RUNNER_TEMP/build$n" && make dist VERSION=v0.0.0-ci SOURCE_DATE_EPOCH=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ct) && cd dist && sha256sum *.tar.gz > "$RUNNER_TEMP/sums$n")
            sleep 2
          done
      - name: The two builds must be byte for byte the same
        run: diff "$RUNNER_TEMP/sums1" "$RUNNER_TEMP/sums2" && cat "$RUNNER_TEMP/sums1"

  debian:
    name: Debian package from debian/ (sid, lintian)
    runs-on: ubuntu-24.04
    container: debian:sid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build exactly as Debian would: build-deps from Debian's own archive, no network for Go.
      - name: Install the build dependencies from debian/control
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends build-essential dpkg-dev lintian
          apt-get build-dep -y -q --no-install-recommends ./
      - name: dpkg-buildpackage
        run: dpkg-buildpackage -b -us -uc
      - name: lintian (errors fail)
        run: lintian --fail-on error ../safeshell_*.deb

  check:
    name: check
    if: always()
    needs: [format-and-vet, unit-tests, install-script, fuzz, integration, native-snapshots, script-check-action, packages, reproducible, debian]
    runs-on: ubuntu-24.04
    steps:
      - name: A job failed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Every job passed
        run: echo "all jobs passed"
